<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LaunchGrad — Early Career & Graduate Job Launchpad</title>
    <meta name="description" content="Early-career job discovery, 1-tap fast applications, interview prep toolkit, and application pipeline tracker for new graduates." />
    <meta property="og:title" content="LaunchGrad — Early Career & Graduate Job Launchpad" />
    <meta property="og:description" content="Early-career job discovery, 1-tap fast applications, interview prep toolkit, and application pipeline tracker for new graduates." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-background text-on-surface antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (
            window.__LAUNCHGRAD_MOUNTED__ ||
            document.querySelector('script[src*="@vite/client"]')
          ) {
            return;
          }
          var css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = './public/static-bundle/app.css';
          document.head.appendChild(css);

          var js = document.createElement('script');
          js.type = 'module';
          js.src = './public/static-bundle/app.js';
          document.body.appendChild(js);
        }, 100);
      });
    </script>
  </body>
</html>
